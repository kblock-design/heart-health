<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fat Facts</title>
<meta name="description" content="Scan a nutrition label and see what percent of its calories come from fat.">
<meta name="theme-color" id="themeColor" content="#e7e9e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fat Facts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&display=swap">
<style>
  /* The whole app is one Nutrition Facts panel: black ink on white paper, heavy
     grotesque type, thick and thin rules. The paper never changes colour; the
     shelf behind it and the panel's thick rule carry the verdict. */
  :root {
    --ink: #000000;
    --paper: #ffffff;
    --well: #eeefea;          /* fill behind editable numbers */
    --shelf: #e7e9e2;         /* page, no result yet */
    --shelf-pass: #c9e9d2;
    --shelf-fail: #f6d0c9;
    --pass: #0a7a3d;
    --fail: #c5261c;
    --on-shelf: #000000;
    --on-shelf-soft: #3d423c;
    --focus: #1857f0;
    --page: var(--shelf);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --shelf: #1a1c19;
      --shelf-pass: #0e3b23;
      --shelf-fail: #4b1611;
      --on-shelf: #ffffff;
      --on-shelf-soft: #c3c8c0;
      --focus: #8fb4ff;
    }
  }
  body.pass { --page: var(--shelf-pass); }
  body.fail { --page: var(--shelf-fail); }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--on-shelf);
    font: 400 16px/1.35 Archivo, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-stretch: 100%;
    padding: max(14px, env(safe-area-inset-top)) 14px max(22px, env(safe-area-inset-bottom));
    transition: background-color .25s;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 430px; margin: 0 auto; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- the panel ---------- */
  .panel { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); padding: 6px 12px 10px; }
  .title {
    margin: 0; font-weight: 900; line-height: .95; letter-spacing: -.035em;
    font-size: clamp(40px, 14.4vw, 62px); font-variant-numeric: tabular-nums;
  }
  .has-result .title { font-size: clamp(64px, 23vw, 100px); letter-spacing: -.05em; line-height: .88; padding-top: 4px; }
  .lede { margin: 4px 0 8px; font-size: 17px; }
  .has-result .lede { font-weight: 800; font-size: 19px; }

  /* The thick rule under the heading. With a result it becomes the verdict. */
  .verdict { background: var(--ink); color: #fff; min-height: 10px; font-weight: 800; font-size: 19px; line-height: 1.2; }
  .verdict:not(:empty) { padding: 9px 10px; }
  .pass .verdict { background: var(--pass); }
  .fail .verdict { background: var(--fail); }

  .per { margin: 8px 0 0; font-weight: 800; font-size: 15px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--ink); }
  .row.first { border-top: 0; padding-top: 0; }
  .row.heavy { border-top-width: 5px; }
  .row label { font-weight: 800; font-size: 19px; }
  .row.first label { font-weight: 900; font-size: 30px; letter-spacing: -.02em; }
  .row.sub { padding-left: 18px; font-size: 17px; }
  .row.sub output { font-weight: 800; font-variant-numeric: tabular-nums; }
  .entry { display: flex; align-items: center; gap: 8px; }

  .panel input {
    font: inherit; font-weight: 900; font-size: 26px; font-variant-numeric: tabular-nums;
    width: 92px; padding: 3px 8px; text-align: right;
    color: var(--ink); background: var(--well); border: 0; border-bottom: 2px solid var(--ink); border-radius: 0;
  }
  .row.first input { font-size: 38px; width: 124px; letter-spacing: -.02em; }
  .panel input::placeholder { color: #8b8f86; }

  .unit { display: flex; border: 2px solid var(--ink); }
  .unit button {
    font: inherit; font-weight: 800; font-size: 16px; min-width: 40px; padding: 7px 6px;
    background: var(--paper); color: var(--ink); border: 0; border-radius: 0; cursor: pointer;
  }
  .unit button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .note { margin: 0; padding-top: 8px; border-top: 10px solid var(--ink); font-size: 14px; line-height: 1.3; }

  /* ---------- controls outside the panel ---------- */
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions button {
    font: inherit; font-weight: 800; font-size: 19px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px;
  }
  .scan { flex: 1; background: var(--on-shelf); color: var(--page); border: 0; transition: color .25s; }
  .pick { width: 58px; background: transparent; color: var(--on-shelf); border: 2px solid var(--on-shelf); }
  .actions button:disabled { opacity: .5; cursor: default; }
  svg { width: 24px; height: 24px; flex: none; }

  .status { display: none; align-items: center; gap: 12px; margin-top: 14px; font-size: 16px; }
  .status.show { display: flex; }
  .status img { width: 48px; height: 48px; object-fit: cover; border: 2px solid var(--on-shelf); flex: none; }
  .status.warn #statusText { font-weight: 800; }
  .progress { height: 5px; margin-top: 6px; border: 1px solid var(--on-shelf); display: none; }
  .busy .progress { display: block; }
  .progress i { display: block; height: 100%; width: 0; background: var(--on-shelf); transition: width .2s; }

  .clear {
    display: block; margin: 14px 0 0 auto; padding: 10px 2px; font: inherit; font-size: 16px; font-weight: 800;
    background: none; border: 0; color: var(--on-shelf-soft); text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  /* ---------- in-app camera ---------- */
  .camera { position: fixed; inset: 0; z-index: 10; background: #000; color: #fff; display: flex; flex-direction: column; }
  .camera .view { position: relative; flex: 1; overflow: hidden; }
  .camera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .camera .hint {
    margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px 12px; min-height: 76px;
    font-weight: 800; font-size: 19px; line-height: 1.25; text-align: center; background: #000;
  }
  /* Drawn around the label once the app has found it; everything else dims. */
  .camera .found {
    position: absolute; border: 4px solid #fff; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5);
    pointer-events: none; transition: left .15s, top .15s, width .15s, height .15s;
  }
  .camera .manual { justify-self: end; max-width: 9ch; text-align: right; font-size: 14px; line-height: 1.2; }
  .camera .bar {
    position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px 16px max(18px, env(safe-area-inset-bottom)); background: #000;
  }
  .camera button { font: inherit; cursor: pointer; }
  .camera .cancel { justify-self: start; background: none; border: 0; color: #fff; font-weight: 800; font-size: 19px; padding: 14px 6px; }
  .camera .shutter { width: 76px; height: 76px; border-radius: 50%; background: #fff; border: 5px solid #000; box-shadow: 0 0 0 4px #fff; }
  .camera .shutter:active { background: #cfcfcf; }
  .camera :focus-visible { outline-color: #8fb4ff; outline-offset: 6px; }
  body.camera-open { overflow: hidden; }

  [hidden] { display: none !important; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <section class="panel" id="panel">
    <div aria-live="polite">
      <h1 class="title" id="pct">Fat Facts</h1>
      <p class="lede" id="lede">Scan a label, or type its calories and total fat.</p>
      <div class="verdict" id="verdict"></div>
    </div>

    <p class="per">Amount per serving</p>
    <div class="row first">
      <label for="cal">Calories</label>
      <input id="cal" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
    </div>
    <div class="row heavy">
      <label for="fat">Total Fat</label>
      <span class="entry">
        <input id="fat" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        <span class="unit" role="group" aria-label="Total fat is in">
          <button type="button" id="unitG" aria-pressed="true" aria-label="grams">g</button>
          <button type="button" id="unitCal" aria-pressed="false" aria-label="calories">cal</button>
        </span>
      </span>
    </div>
    <div class="row sub"><span id="convLabel">Calories from fat</span><output id="conv">0</output></div>
    <div class="row sub"><span>Most fat that stays at 20%</span><output id="maxFat">0 g</output></div>
    <p class="note">1 g of fat has 9 calories. Labels round their numbers, so the result is close, not exact.</p>
  </section>

  <div class="actions">
    <button class="scan" id="scanBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>
      Scan label
    </button>
    <button class="pick" id="pickBtn" type="button" aria-label="Choose a photo of a label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><circle cx="9" cy="10" r="1.5"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
    </button>
  </div>
  <input class="visually-hidden" id="fileInput" type="file" accept="image/*" tabindex="-1" aria-hidden="true">

  <div class="status" id="status" aria-live="polite">
    <img id="thumb" alt="" hidden>
    <div style="flex:1">
      <span id="statusText"></span>
      <div class="progress"><i id="barFill"></i></div>
    </div>
  </div>

  <button class="clear" type="button" id="clearBtn" hidden>Clear numbers</button>
</main>

<div class="camera" id="camera" role="dialog" aria-modal="true" aria-label="Scan a label" hidden>
  <p class="hint" id="camHint" aria-live="polite">Point the camera at a Nutrition Facts label</p>
  <div class="view" id="camView">
    <video id="video" playsinline muted autoplay></video>
    <div class="found" id="foundBox" hidden></div>
  </div>
  <div class="bar">
    <button class="cancel" id="camCancel" type="button">Cancel</button>
    <button class="shutter" id="shutter" type="button" aria-label="Read the label now"></button>
    <span class="manual">Tap to read it now</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
